name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zipzy
          POSTGRES_PASSWORD: zipzy
          POSTGRES_DB: zipzy_dba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zipzy -d zipzy_dba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://zipzy:zipzy@127.0.0.1:5432/zipzy_dba_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Tests (includes migrations up/down and drift check)
        run: uv run pytest -q
    dashboard:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      defaults:
        run:
          working-directory: dashboard
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: dashboard/package-lock.json
        - run: npm ci
        - run: npm run lint
        - run: npm run build      